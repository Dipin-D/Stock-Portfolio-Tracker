AWSTemplateFormatVersion: '2010-09-09'
Description: Single-host EC2 stack for Trading Pro production.

Parameters:
  InstanceName:
    Type: String
    Default: trading-pro-prod
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
  AdminCidr:
    Type: String
    Description: CIDR allowed to SSH to the instance, for example 203.0.113.10/32.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 200
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  TradingProSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Trading Pro single-host production
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-sg'

  TradingProRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ssm-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  TradingProInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref TradingProRole
      InstanceProfileName: !Sub '${AWS::StackName}-instance-profile'

  TradingProInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref TradingProInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref TradingProSecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Ref InstanceName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /srv/trading-pro /var/log/trading-pro-bootstrap
          echo "Stack ${AWS::StackName} bootstrapped on $(date -Is)" >> /var/log/trading-pro-bootstrap/user-data.log

  TradingProElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref TradingProInstance
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-eip'

Outputs:
  InstanceId:
    Value: !Ref TradingProInstance
  PublicIp:
    Value: !Ref TradingProElasticIp
  PublicDnsName:
    Value: !GetAtt TradingProInstance.PublicDnsName
  SecurityGroupId:
    Value: !Ref TradingProSecurityGroup
  InstanceProfileName:
    Value: !Ref TradingProInstanceProfile
