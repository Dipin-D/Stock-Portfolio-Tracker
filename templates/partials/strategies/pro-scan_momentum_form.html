<div id="proscan-momentum-modal" class="proscan-modal hidden" aria-hidden="true">
    <div class="proscan-modal-card">
        <div class="proscan-modal-header">
            <h3>Configure Momentum</h3>
            <p>Choose the lookback window, thresholds, and position sizing for the scan.</p>
        </div>

        <form id="proscan-momentum-form" class="proscan-form-grid">
            <label class="proscan-field">
                <span>Start Date</span>
                <input type="date" id="ps-mom-start-date" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>End Date</span>
                <input type="date" id="ps-mom-end-date" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Lookback (days)</span>
                <input type="number" id="ps-mom-lookback" value="60" min="1" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Buy Threshold (%)</span>
                <input type="number" id="ps-mom-buy-threshold" value="2" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Exit Threshold (%)</span>
                <input type="number" id="ps-mom-exit-threshold" value="0" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Order Percentage (%)</span>
                <input type="number" id="ps-mom-order-percentage" value="100" min="1" max="100" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Starting Cash ($)</span>
                <input type="number" id="ps-mom-starting-cash" value="100000" min="1" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Override Shares (optional)</span>
                <input type="number" id="ps-mom-override-shares" min="1" step="1" class="proscan-input" placeholder="Leave blank to size automatically">
            </label>

            <div class="proscan-modal-actions proscan-field-full">
                <button type="button" id="ps-mom-cancel" class="proscan-btn proscan-btn-ghost">Cancel</button>
                <button type="submit" class="proscan-btn proscan-btn-primary">Create Strategy Card</button>
            </div>
        </form>
    </div>
</div>
