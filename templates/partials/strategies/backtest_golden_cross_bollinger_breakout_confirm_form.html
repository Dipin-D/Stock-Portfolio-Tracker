<div id="golden-cross-bollinger-breakout-confirm-modal" class="indicator-modal" style="display:none" aria-hidden="true">
  <div class="indicator-modal-card" style="width:min(560px,100%)">
    <div class="indicator-modal-header">
      <h3>Configure Golden Cross + Bollinger Breakout Confirm</h3>
      <p>Use the squeeze setup plus a stricter upper-band breakout confirmation before entry.</p>
    </div>
    <form id="golden-cross-bollinger-breakout-confirm-form">
      <label class="block text-sm font-medium text-gray-700 mb-1">Fast SMA</label>
      <input id="gcbc-fast-sma" type="number" value="50" min="1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Slow SMA</label>
      <input id="gcbc-slow-sma" type="number" value="200" min="1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Bollinger Period</label>
      <input id="gcbc-bb-period" type="number" value="20" min="2" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Bollinger Std Dev</label>
      <input id="gcbc-bb-std-dev" type="number" value="2" min="0.5" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Squeeze Lookback</label>
      <input id="gcbc-squeeze-lookback" type="number" value="20" min="5" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Squeeze Quantile</label>
      <input id="gcbc-squeeze-quantile" type="number" value="0.35" min="0.05" max="0.95" step="0.01" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Order Percentage (%)</label>
      <input id="gcbc-order-percentage" type="number" value="100" min="1" max="100" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Starting Cash ($)</label>
      <input id="gcbc-starting-cash" type="number" value="100000" min="1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Override Shares (Optional)</label>
      <input id="gcbc-override-shares" type="number" placeholder="Leave blank to compute" class="mt-1 block w-full border border-gray-300 rounded-md p-2">

      <div class="indicator-modal-actions">
        <button type="button" id="gcbc-cancel" class="indicator-card-btn">Cancel</button>
        <button type="submit" class="indicator-card-btn indicator-card-btn-primary">Save Strategy</button>
      </div>
    </form>
  </div>
</div>
