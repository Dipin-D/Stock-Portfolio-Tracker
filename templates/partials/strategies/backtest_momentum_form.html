<div id="momentum-modal" class="indicator-modal" style="display:none" aria-hidden="true">
  <div class="indicator-modal-card" style="width:min(520px,100%)">
    <div class="indicator-modal-header">
      <h3>Configure Momentum 12M</h3>
      <p>Use the posterior from one completed run before adding this as the next evidence source in multi-strategy mode.</p>
    </div>
    <form id="momentum-form">
      <label class="block text-sm font-medium text-gray-700 mb-1">Lookback (days)</label>
      <input id="mom-lookback" type="number" value="252" min="5" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Buy Threshold (%)</label>
      <input id="mom-threshold" type="number" value="0" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Exit Threshold (%)</label>
      <input id="mom-exit" type="number" value="-2" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Order Percentage (%)</label>
      <input id="mom-order-pct" type="number" value="100" min="1" max="100" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Starting Cash ($)</label>
      <input id="mom-cash" type="number" value="100000" min="1" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>

      <label class="block text-sm font-medium text-gray-700 mt-4 mb-1">Override Shares (Optional)</label>
      <input id="mom-override" type="number" placeholder="Leave blank to compute" class="mt-1 block w-full border border-gray-300 rounded-md p-2">

      <div class="indicator-modal-actions">
        <button type="button" id="mom-cancel" class="indicator-card-btn">Cancel</button>
        <button type="submit" class="indicator-card-btn indicator-card-btn-primary">Save Strategy</button>
      </div>
    </form>
  </div>
</div>
