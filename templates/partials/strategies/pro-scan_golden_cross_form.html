<div id="proscan-gc-modal" class="proscan-modal hidden" aria-hidden="true">
    <div class="proscan-modal-card">
        <div class="proscan-modal-header">
            <h3>Configure Golden Cross</h3>
            <p>Set the date range and execution inputs for the group backtest.</p>
        </div>

        <form id="proscan-gc-form" class="proscan-form-grid">
            <label class="proscan-field">
                <span>Start Date</span>
                <input type="date" id="ps-gc-start-date" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>End Date</span>
                <input type="date" id="ps-gc-end-date" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Fast SMA</span>
                <input type="number" id="ps-gc-fast-sma" value="50" min="1" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Slow SMA</span>
                <input type="number" id="ps-gc-slow-sma" value="200" min="1" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Order Percentage (%)</span>
                <input type="number" id="ps-gc-order-percentage" value="100" min="1" max="100" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field">
                <span>Starting Cash ($)</span>
                <input type="number" id="ps-gc-starting-cash" value="100000" min="1" step="0.01" class="proscan-input" required>
            </label>

            <label class="proscan-field proscan-field-full">
                <span>Override Shares (optional)</span>
                <input type="number" id="ps-gc-override-shares" min="1" step="1" class="proscan-input" placeholder="Leave blank to size automatically">
            </label>

            <div class="proscan-modal-actions proscan-field-full">
                <button type="button" id="ps-gc-cancel" class="proscan-btn proscan-btn-ghost">Cancel</button>
                <button type="submit" class="proscan-btn proscan-btn-primary">Create Strategy Card</button>
            </div>
        </form>
    </div>
</div>
